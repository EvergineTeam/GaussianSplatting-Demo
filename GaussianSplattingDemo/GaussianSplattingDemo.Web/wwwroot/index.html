<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>GaussianSplattingDemo.Web</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Barlow" />
    <script type="text/javascript" src="gsplat_cache_manifest.js"></script>
    <script type="text/javascript" src="gsplat_cache.js"></script>
    <script type="text/javascript">
        window.gSplatCache.loadStylesheet("styles", "styles.css");
    </script>
    <script type="text/javascript" src="evergine.js"></script>
</head>

<body class="dark">
    <div id="evergine-canvas-container"></div>
    <div id="splash">
        <div id="splash-content">
            <div class="logo-container">
                <img class="logo-img" alt="Evergine logo" />
                <div class="separator"></div>
            </div>
            <div id="loading-bar" class="progress">
                <div>
                    <strong>Loading...</strong>
                    <div class="loading-bar-container">
                        <div id="loading-bar-percentage" class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- First we load web assembly code -->
    <script type="text/javascript">
        window.gSplatCache.loadScript("blazor", "_framework/blazor.webassembly.js", { autostart: "false" });
    </script>

    <!-- Then, start loading the assets into the vfs -->
    <script src="assets.js"></script>

    <script type="text/javascript">
        window.gSplatCache.loadScript("gaussiansplatting", "evergine_gaussiansplatting.js");
    </script>

    <!-- Finally, run evergine -->
    <script type="text/javascript">
        var app = new App(
            "GaussianSplattingDemo.Web",
            "GaussianSplattingDemo.Web.Program",
            new EvergineModule()
        );
        Blazor.start({
            loadBootResource: function (_type, _name, defaultUri) {
                return window.gSplatCache.versionedUrl("blazor", defaultUri);
            }
        }).then(function () {
            // It is not mandatory to run Evergine now, but it must run after blazor is started
            app.startEvergine();
        });

        //// It is possible to delete the Evergine instance by running
        // app.destroyEvergine();
    </script>
</body>
</html>
